[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tesla-peak-pause"
version = "0.1.0"
description = "Tesla Peak Pause — stop charging during expensive peak hours. Tesla's off-peak scheduling only takes a start time; this pauses charging for the whole peak window (e.g. SCE 4–9pm) and resumes after. Built on the free official Fleet API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raphael Malikian", email = "rtmalikian@gmail.com" }]
keywords = ["tesla", "fleet-api", "charging", "off-peak", "time-of-use", "sce", "ev-charging", "home-automation"]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]

[project.scripts]
tpp = "tesla_peak_pause.cli:main"

[project.urls]
Homepage = "https://github.com/rtmalikian/tesla-peak-pause"
Issues = "https://github.com/rtmalikian/tesla-peak-pause/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
